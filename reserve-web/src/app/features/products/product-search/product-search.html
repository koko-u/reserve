<div class="card bg-body-tertiary border-0 mb-4">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-8">
        <label for="product-search" class="form-label">製品を検索</label>
        <input
          id="product-search"
          type="search"
          class="form-control"
          placeholder="製品名・カテゴリ・製品コードなど"
          [formField]="productQueryForm.searchQuery"
        />
      </div>
      <div class="col-12 col-md-4">
        <div class="form-check mb-md-2">
          <input
            id="in-stock-only"
            type="checkbox"
            class="form-check-input"
            [formField]="productQueryForm.inStockOnly"
          />
          <label for="in-stock-only" class="form-check-label">在庫ありのみ表示</label>
        </div>
      </div>
    </div>
  </div>
</div>
